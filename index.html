<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><meta name='theme-color' content='#f2f2f7'><title>Equipment Manager</title><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon.svg'><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:#111;background:#f2f2f7}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));}header{padding:18px 16px 8px}h1{font-size:30px;margin:0}main{padding:0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:16px;padding:16px;box-shadow:0 1px 3px #0001}.num{font-size:28px;font-weight:700}.muted{color:#666;font-size:13px}.danger{color:#c00}.warn{color:#a65b00}.ok{color:#087b36}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar input,.toolbar select,input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #ddd;border-radius:12px;background:white}button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:#007aff;color:white;font-weight:600}button.secondary{background:#e5e5ea;color:#111}button.dangerBtn{background:#ff3b30}.item{background:white;border-radius:14px;padding:14px;margin:9px 0}.itemTop{display:flex;justify-content:space-between;gap:8px}.badge{font-size:12px;background:#eee;border-radius:999px;padding:4px 8px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.tabs button{background:transparent;color:#666;padding:7px 2px;font-size:12px}.tabs button.active{color:#007aff}.page{display:none}.page.active{display:block}.fab{position:fixed;right:18px;bottom:90px;border-radius:50%;width:54px;height:54px;font-size:28px;box-shadow:0 3px 12px #0003}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{display:block;font-size:13px;color:#555;margin:12px 2px 5px}.formActions{display:flex;gap:8px;margin:18px 0}.sectionTitle{font-size:20px;margin:18px 2px 8px}.empty{text-align:center;color:#777;padding:30px 10px}@media(min-width:700px){main{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1 id='title'>Dashboard</h1></header><main>
<section id='dashboard' class='page active'><div class='grid'><div class='card'><div class='muted'>Equipment gesamt</div><div class='num' id='total'>0</div></div><div class='card'><div class='muted'>Überfällig</div><div class='num danger' id='overdue'>0</div></div><div class='card'><div class='muted'>≤ 30 Tage</div><div class='num warn' id='dueSoon'>0</div></div><div class='card'><div class='muted'>Aktiv</div><div class='num ok' id='activeCount'>0</div></div></div><h2 class='sectionTitle'>Kategorien</h2><div id='categories' class='card'></div><h2 class='sectionTitle'>Nächste Prüfungen</h2><div id='nextChecks'></div></section>
<section id='equipment' class='page'><div class='toolbar'><input id='search' placeholder='Suchen…'><select id='filter'><option value=''>Alle Kategorien</option><option>IT</option><option>Maschinen</option><option>Messmittel</option></select></div><div id='list'></div></section>
<section id='checks' class='page'><div class='toolbar'><select id='checkFilter'><option value='all'>Alle Prüfungen</option><option value='overdue'>Überfällig</option><option value='soon'>In 30 Tagen</option></select></div><div id='checkList'></div></section>
<section id='settings' class='page'><div class='card'><h2 style='margin-top:0'>Datensicherung</h2><p class='muted'>Die Daten werden lokal in diesem Browser gespeichert. Erstelle regelmäßig eine Sicherung.</p><div class='formActions'><button id='exportBtn'>CSV exportieren</button><button class='secondary' id='importBtn'>CSV importieren</button><input type='file' id='importFile' accept='.csv,text/csv' hidden></div></div></section>
<section id='formPage' class='page form'><div class='card'><input type='hidden' id='editId'><label>Equipment-Nr.</label><input id='eqNo' required><label>Bezeichnung</label><input id='name' required><div class='row'><div><label>Kategorie</label><select id='category'><option>IT</option><option>Maschinen</option><option>Messmittel</option></select></div><div><label>Status</label><select id='status'><option>Aktiv</option><option>Inaktiv</option><option>Ausgemustert</option></select></div></div><label>Hersteller</label><input id='manufacturer'><label>Modell</label><input id='model'><label>Seriennummer</label><input id='serial'><label>Standort</label><input id='location'><label>Verantwortlicher</label><input id='owner'><div class='row'><div><label>Letzte Prüfung</label><input id='lastCheck' type='date'></div><div><label>Intervall (Monate)</label><input id='interval' type='number' min='0' value='12'></div></div><label>Nächste Prüfung</label><input id='nextCheck' type='date'><label>Bemerkungen</label><textarea id='notes' rows='3'></textarea><div class='formActions'><button id='saveBtn'>Speichern</button><button class='secondary' id='cancelBtn'>Abbrechen</button><button class='dangerBtn' id='deleteBtn' style='display:none'>Löschen</button></div></div></section>
</main><button class='fab' id='addBtn'>+</button><nav class='tabs' id='tabs'><button data-page='dashboard' class='active'>▦<br>Dashboard</button><button data-page='equipment'>☷<br>Equipment</button><button data-page='checks'>✓<br>Prüfungen</button><button data-page='settings'>⚙︎<br>Einstellungen</button></nav>
<script>
const DB='equipment-manager-v3', STORE='equipment'; let db;
const $=id=>document.getElementById(id); const fields=['eqNo','name','category','status','manufacturer','model','serial','location','owner','lastCheck','interval','nextCheck','notes'];
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function days(d){if(!d)return 99999;return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}
function calcNext(){if($('lastCheck').value&&+$('interval').value){let d=new Date($('lastCheck').value+'T12:00:00');d.setMonth(d.getMonth()+ +$('interval').value);$('nextCheck').value=d.toISOString().slice(0,10)}}
$('lastCheck').onchange=calcNext;$('interval').onchange=calcNext;
async function render(){let a=await all();$('total').textContent=a.length;$('overdue').textContent=a.filter(x=>days(x.nextCheck)<0).length;$('dueSoon').textContent=a.filter(x=>days(x.nextCheck)>=0&&days(x.nextCheck)<=30).length;$('activeCount').textContent=a.filter(x=>x.status==='Aktiv').length;let counts=['IT','Maschinen','Messmittel'].map(c=>`${c}: <b>${a.filter(x=>x.category===c).length}</b>`).join('<br><br>');$('categories').innerHTML=counts||'Keine Daten';let next=[...a].filter(x=>x.nextCheck).sort((x,y)=>x.nextCheck.localeCompare(y.nextCheck)).slice(0,5);$('nextChecks').innerHTML=next.length?next.map(card).join(''):'<div class="empty">Noch keine Prüfungen erfasst.</div>';renderList(a);renderChecks(a)}
function card(x){let d=days(x.nextCheck),cl=d<0?'danger':d<=30?'warn':'ok';return `<div class='item' onclick="edit('${x.id}')"><div class='itemTop'><b>${esc(x.eqNo)} · ${esc(x.name)}</b><span class='badge'>${esc(x.category)}</span></div><div class='muted'>${esc(x.location||'Kein Standort')} · ${esc(x.status)}</div>${x.nextCheck?`<div class='${cl}' style='margin-top:7px'>Prüfung: ${new Date(x.nextCheck+'T12:00:00').toLocaleDateString('de-DE')}</div>`:''}</div>`}
function renderList(a){let q=$('search').value.toLowerCase(),f=$('filter').value;a=a.filter(x=>(!f||x.category===f)&&Object.values(x).join(' ').toLowerCase().includes(q)).sort((x,y)=>(x.eqNo||'').localeCompare(y.eqNo||'',undefined,{numeric:true}));$('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Kein Equipment gefunden.</div>'}
function renderChecks(a){let f=$('checkFilter').value;a=a.filter(x=>x.nextCheck);if(f==='overdue')a=a.filter(x=>days(x.nextCheck)<0);if(f==='soon')a=a.filter(x=>days(x.nextCheck)>=0&&days(x.nextCheck)<=30);a.sort((x,y)=>x.nextCheck.localeCompare(y.nextCheck));$('checkList').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Keine passenden Prüfungen.</div>'}
$('search').oninput=render;$('filter').onchange=render;$('checkFilter').onchange=render;
function show(p,title){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');$('title').textContent=title||({dashboard:'Dashboard',equipment:'Equipment',checks:'Prüfungen',settings:'Einstellungen',formPage:'Equipment'}[p]);$('addBtn').style.display=p==='formPage'?'none':'block';$('tabs').style.display=p==='formPage'?'none':'grid';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p!=='formPage')render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.page));$('addBtn').onclick=()=>{fields.forEach(f=>$(f).value='');$('category').value='IT';$('status').value='Aktiv';$('interval').value='12';$('editId').value='';$('deleteBtn').style.display='none';show('formPage','Neues Equipment')};$('cancelBtn').onclick=()=>show('equipment');
window.edit=async id=>{let a=await all(),x=a.find(y=>y.id===id);if(!x)return;$('editId').value=id;fields.forEach(f=>$(f).value=x[f]??'');$('deleteBtn').style.display='block';show('formPage','Equipment bearbeiten')};
$('saveBtn').onclick=async()=>{if(!$('eqNo').value.trim()||!$('name').value.trim()){alert('Equipment-Nr. und Bezeichnung sind erforderlich.');return}let x={id:$('editId').value||crypto.randomUUID()};fields.forEach(f=>x[f]=$(f).value);x.interval=+x.interval||0;await put(x);show('equipment')};$('deleteBtn').onclick=async()=>{if(confirm('Equipment wirklich löschen?')){await del($('editId').value);show('equipment')}};
function csvVal(v){return '"'+String(v??'').replaceAll('"','""')+'"'}$('exportBtn').onclick=async()=>{let a=await all(),cols=['id',...fields],csv=[cols.join(';'),...a.map(x=>cols.map(c=>csvVal(x[c])).join(';'))].join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='equipment-backup.csv';el.click();URL.revokeObjectURL(u)};$('importBtn').onclick=()=>$('importFile').click();
function parseCSV(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c==='"'){if(q&&n==='"'){v+='"';i++}else q=!q}else if(c===';'&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);if(row.some(Boolean))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(Boolean))rows.push(row);return rows}
$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;let rows=parseCSV(await file.text()),head=rows.shift();let count=0;for(let r of rows){let x={};head.forEach((h,i)=>x[h]=r[i]||'');x.id=x.id||crypto.randomUUID();x.interval=+x.interval||0;await put(x);count++}alert(count+' Datensätze importiert.');render();e.target.value=''};
openDB().then(render);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
