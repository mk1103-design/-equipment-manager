<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f2f2f7"><title>Equipment Manager 3.2</title><link rel="manifest" href="manifest.json"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:#111;background:#f2f2f7}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}header{padding:18px 16px 8px}h1{font-size:30px;margin:0}main{padding:0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.item{background:#fff;border-radius:16px;padding:15px;box-shadow:0 1px 3px #0001}.item{margin:9px 0}.num{font-size:28px;font-weight:700}.muted{color:#666;font-size:13px}.danger{color:#c00}.warn{color:#a65b00}.ok{color:#087b36}.toolbar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.toolbar>*{flex:1;min-width:130px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:#007aff;color:#fff;font-weight:600}button.secondary{background:#e5e5ea;color:#111}button.dangerBtn{background:#ff3b30}.itemTop{display:flex;justify-content:space-between;gap:8px}.badge{font-size:12px;background:#eee;border-radius:999px;padding:4px 8px;white-space:nowrap}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #ddd;z-index:5}.tabs button{background:transparent;color:#666;padding:7px 2px;font-size:12px}.tabs button.active{color:#007aff}.page{display:none}.page.active{display:block}.fab{position:fixed;right:18px;bottom:92px;border-radius:50%;width:54px;height:54px;font-size:28px;box-shadow:0 3px 12px #0003;z-index:4}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{display:block;font-size:13px;color:#555;margin:12px 2px 5px}.formActions{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.sectionTitle{font-size:20px;margin:18px 2px 8px}.empty{text-align:center;color:#777;padding:30px 10px}.detailLine{margin:6px 0}.divider{height:1px;background:#eee;margin:14px 0}.history{border-left:3px solid #ddd;padding-left:12px;margin:10px 0}.small{font-size:12px}@media(min-width:700px){main{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header><h1 id="title">Dashboard</h1></header><main>
<section id="dashboard" class="page active"><div class="grid"><div class="card"><div class="muted">Equipment gesamt</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">Überfällig</div><div class="num danger" id="overdue">0</div></div><div class="card"><div class="muted">≤ 30 Tage</div><div class="num warn" id="due30">0</div></div><div class="card"><div class="muted">≤ 90 Tage</div><div class="num" id="due90">0</div></div><div class="card"><div class="muted">Ohne Prüfung</div><div class="num" id="noCheck">0</div></div></div><h2 class="sectionTitle">Kategorien</h2><div id="categories" class="card"></div><h2 class="sectionTitle">Nächste Prüfungen</h2><div id="nextChecks"></div></section>
<section id="equipment" class="page"><div class="toolbar"><input id="search" placeholder="Suchen…"><select id="filterCategory"><option value="">Alle Kategorien</option><option>IT</option><option>Maschinen</option><option>Messmittel</option></select><input id="filterLocation" placeholder="Standort"><select id="filterState"><option value="">Alle Prüfstatus</option><option value="overdue">Überfällig</option><option value="30">≤ 30 Tage</option><option value="90">≤ 90 Tage</option><option value="none">Ohne Prüfung</option></select></div><div id="list"></div></section>
<section id="checks" class="page"><div class="toolbar"><select id="checkFilter"><option value="all">Alle Prüfungen</option><option value="overdue">Überfällig</option><option value="30">≤ 30 Tage</option><option value="90">≤ 90 Tage</option></select></div><div id="checkList"></div></section>
<section id="settings" class="page"><div class="card"><h2 style="margin-top:0">Datensicherung</h2><p class="muted">Backup 3.2 enthält Equipment und die komplette Prüfhistorie.</p><div class="formActions"><button id="backupBtn">Backup erstellen</button><button class="secondary" id="restoreBtn">Backup wiederherstellen</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div><div class="formActions"><button id="exportBtn">Equipment CSV</button><button class="secondary" id="importBtn">Equipment CSV importieren</button><input type="file" id="importFile" accept=".csv,text/csv" hidden></div><p class="muted">Version 3.2 · Daten bleiben lokal auf diesem Gerät.</p></div></section>
<section id="formPage" class="page form"><div class="card"><input type="hidden" id="editId"><label>Equipment-Nr.</label><input id="eqNo"><label>Bezeichnung</label><input id="name"><div class="row"><div><label>Kategorie</label><select id="category"><option>IT</option><option>Maschinen</option><option>Messmittel</option></select></div><div><label>Status</label><select id="status"><option>Aktiv</option><option>Inaktiv</option><option>Ausgemustert</option></select></div></div><label>Equipment-Typ</label><input id="equipmentType"><label>Hersteller</label><input id="manufacturer"><label>Modell</label><input id="model"><label>Seriennummer</label><input id="serial"><label>Standort</label><input id="location"><label>Bereich / Abteilung</label><input id="department"><label>Verantwortlicher</label><input id="owner"><label>Inbetriebnahme</label><input id="commissioned" type="date"><label>Bemerkungen</label><textarea id="notes" rows="3"></textarea><div class="formActions"><button id="saveBtn">Speichern</button><button class="secondary" id="cancelBtn">Abbrechen</button><button class="dangerBtn" id="deleteBtn" style="display:none">Löschen</button></div></div></section>
<section id="detailPage" class="page"><div id="detail"></div></section>
<section id="inspectionForm" class="page form"><div class="card"><input type="hidden" id="inspEqId"><input type="hidden" id="inspId"><label>Prüfart</label><input id="inspType" placeholder="z. B. DGUV V3, Kalibrierung, Wartung"><div class="row"><div><label>Letzte Prüfung</label><input id="inspLast" type="date"></div><div><label>Intervall (Monate)</label><input id="inspInterval" type="number" min="0" value="12"></div></div><label>Nächste Prüfung</label><input id="inspNext" type="date"><label>Prüfer</label><input id="inspInspector"><label>Ergebnis / Bemerkung</label><textarea id="inspResult" rows="3"></textarea><div class="formActions"><button id="saveInspection">Prüfung speichern</button><button class="secondary" id="cancelInspection">Abbrechen</button></div></div></section>
</main><button class="fab" id="addBtn">+</button><nav class="tabs" id="tabs"><button data-page="dashboard" class="active">▦<br>Dashboard</button><button data-page="equipment">☷<br>Equipment</button><button data-page="checks">✓<br>Prüfungen</button><button data-page="settings">⚙︎<br>Einstellungen</button></nav>
<script>
const DB='equipment-manager-v3', EQ='equipment', INS='inspections';let db,currentDetail=null;const $=id=>document.getElementById(id);const eqFields=['eqNo','name','category','status','equipmentType','manufacturer','model','serial','location','department','owner','commissioned','notes'];
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(EQ))d.createObjectStore(EQ,{keyPath:'id'});if(!d.objectStoreNames.contains(INS)){let s=d.createObjectStore(INS,{keyPath:'id'});s.createIndex('equipmentId','equipmentId')}};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function getAll(store){return new Promise((res,rej)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(store,x){return new Promise((res,rej)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(x);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function days(d){if(!d)return 99999;return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('de-DE'):'–'}
function state(d){let n=days(d);if(!d)return {text:'Keine Prüfung',cl:'muted'};if(n<0)return{text:'Überfällig',cl:'danger'};if(n<=30)return{text:'≤ 30 Tage',cl:'warn'};if(n<=90)return{text:'≤ 90 Tage',cl:''};return{text:'In Ordnung',cl:'ok'}}
function latestFor(eq,ins){let a=ins.filter(i=>i.equipmentId===eq.id&&i.nextCheck).sort((a,b)=>a.nextCheck.localeCompare(b.nextCheck));if(a.length)return a[0];if(eq.nextCheck)return{type:eq.checkType||'Prüfung',nextCheck:eq.nextCheck,lastCheck:eq.lastCheck,interval:eq.interval,legacy:true};return null}
async function migrateLegacy(){let eqs=await getAll(EQ),ins=await getAll(INS);for(let e of eqs){if(e.nextCheck&&!ins.some(i=>i.equipmentId===e.id)){await put(INS,{id:crypto.randomUUID(),equipmentId:e.id,type:e.checkType||'Prüfung',lastCheck:e.lastCheck||'',interval:+e.interval||0,nextCheck:e.nextCheck||'',inspector:'',result:'Aus Version 3.1 übernommen',createdAt:new Date().toISOString()})}}}
function card(e,ins){let i=latestFor(e,ins),st=state(i?.nextCheck);return `<div class="item" onclick="detailOpen('${e.id}')"><div class="itemTop"><b>${esc(e.eqNo)} · ${esc(e.name)}</b><span class="badge">${esc(e.category)}</span></div><div class="muted">${esc(e.equipmentType||'Kein Typ')} · ${esc(e.location||'Kein Standort')}</div><div class="${st.cl}" style="margin-top:7px">● ${st.text}${i?.nextCheck?' · '+fmt(i.nextCheck):''}</div></div>`}
async function render(){let [eqs,ins]=await Promise.all([getAll(EQ),getAll(INS)]);$('total').textContent=eqs.length;let due=eqs.map(e=>latestFor(e,ins));$('overdue').textContent=due.filter(i=>i&&days(i.nextCheck)<0).length;$('due30').textContent=due.filter(i=>i&&days(i.nextCheck)>=0&&days(i.nextCheck)<=30).length;$('due90').textContent=due.filter(i=>i&&days(i.nextCheck)>30&&days(i.nextCheck)<=90).length;$('noCheck').textContent=due.filter(i=>!i||!i.nextCheck).length;$('categories').innerHTML=['IT','Maschinen','Messmittel'].map(c=>`${c}: <b>${eqs.filter(e=>e.category===c).length}</b>`).join('<br><br>');let upcoming=eqs.filter(e=>latestFor(e,ins)?.nextCheck).sort((a,b)=>latestFor(a,ins).nextCheck.localeCompare(latestFor(b,ins).nextCheck)).slice(0,5);$('nextChecks').innerHTML=upcoming.length?upcoming.map(e=>card(e,ins)).join(''):'<div class="empty">Noch keine Prüfungen erfasst.</div>';renderList(eqs,ins);renderChecks(eqs,ins)}
function renderList(eqs,ins){let q=$('search').value.toLowerCase(),c=$('filterCategory').value,l=$('filterLocation').value.toLowerCase(),f=$('filterState').value;eqs=eqs.filter(e=>(!c||e.category===c)&&(!l||(e.location||'').toLowerCase().includes(l))&&Object.values(e).join(' ').toLowerCase().includes(q));if(f)eqs=eqs.filter(e=>{let i=latestFor(e,ins),n=i?days(i.nextCheck):99999;if(f==='none')return !i||!i.nextCheck;if(f==='overdue')return n<0;if(f==='30')return n>=0&&n<=30;if(f==='90')return n>=0&&n<=90});eqs.sort((a,b)=>(a.eqNo||'').localeCompare(b.eqNo||'',undefined,{numeric:true}));$('list').innerHTML=eqs.length?eqs.map(e=>card(e,ins)).join(''):'<div class="empty">Kein Equipment gefunden.</div>'}
function renderChecks(eqs,ins){let f=$('checkFilter').value,a=ins.filter(i=>i.nextCheck);if(f==='overdue')a=a.filter(i=>days(i.nextCheck)<0);if(f==='30')a=a.filter(i=>days(i.nextCheck)>=0&&days(i.nextCheck)<=30);if(f==='90')a=a.filter(i=>days(i.nextCheck)>=0&&days(i.nextCheck)<=90);a.sort((a,b)=>a.nextCheck.localeCompare(b.nextCheck));$('checkList').innerHTML=a.length?a.map(i=>{let e=eqs.find(x=>x.id===i.equipmentId)||{},s=state(i.nextCheck);return `<div class="item" onclick="detailOpen('${e.id}')"><b>${esc(e.eqNo||'')} · ${esc(i.type||'Prüfung')}</b><div>${esc(e.name||'')}</div><div class="${s.cl}">● ${s.text} · ${fmt(i.nextCheck)}</div></div>`}).join(''):'<div class="empty">Keine passenden Prüfungen.</div>'}
['search','filterLocation'].forEach(id=>$(id).oninput=render);['filterCategory','filterState','checkFilter'].forEach(id=>$(id).onchange=render);
function show(p,title){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');$('title').textContent=title||({dashboard:'Dashboard',equipment:'Equipment',checks:'Prüfungen',settings:'Einstellungen'}[p]||'Equipment');let special=['formPage','detailPage','inspectionForm'].includes(p);$('addBtn').style.display=special?'none':'block';$('tabs').style.display=special?'none':'grid';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(!special)render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.page));$('addBtn').onclick=()=>{eqFields.forEach(f=>$(f).value='');$('category').value='IT';$('status').value='Aktiv';$('editId').value='';$('deleteBtn').style.display='none';show('formPage','Neues Equipment')};$('cancelBtn').onclick=()=>show('equipment');
window.detailOpen=async id=>{currentDetail=id;let [eqs,ins]=await Promise.all([getAll(EQ),getAll(INS)]),e=eqs.find(x=>x.id===id);if(!e)return;let hist=ins.filter(i=>i.equipmentId===id).sort((a,b)=>(b.lastCheck||b.createdAt||'').localeCompare(a.lastCheck||a.createdAt||''));$('detail').innerHTML=`<div class="card"><div class="itemTop"><div><h2 style="margin:0">${esc(e.eqNo)} · ${esc(e.name)}</h2><div class="muted">${esc(e.category)} · ${esc(e.status)}</div></div></div><div class="divider"></div><div class="detailLine"><b>Typ:</b> ${esc(e.equipmentType||'–')}</div><div class="detailLine"><b>Hersteller / Modell:</b> ${esc(e.manufacturer||'–')} / ${esc(e.model||'–')}</div><div class="detailLine"><b>Seriennummer:</b> ${esc(e.serial||'–')}</div><div class="detailLine"><b>Standort:</b> ${esc(e.location||'–')}</div><div class="detailLine"><b>Bereich:</b> ${esc(e.department||'–')}</div><div class="detailLine"><b>Verantwortlich:</b> ${esc(e.owner||'–')}</div><div class="detailLine"><b>Inbetriebnahme:</b> ${fmt(e.commissioned)}</div><div class="detailLine"><b>Bemerkung:</b> ${esc(e.notes||'–')}</div><div class="formActions"><button onclick="editEq('${e.id}')">Equipment bearbeiten</button><button class="secondary" onclick="newInspection('${e.id}')">Prüfung hinzufügen</button><button class="secondary" onclick="show('equipment')">Zurück</button></div></div><h2 class="sectionTitle">Prüfhistorie</h2>${hist.length?hist.map(i=>`<div class="item history"><b>${esc(i.type||'Prüfung')}</b><div>Letzte Prüfung: ${fmt(i.lastCheck)} · Nächste: ${fmt(i.nextCheck)}</div><div class="muted">Intervall: ${i.interval||0} Monate · Prüfer: ${esc(i.inspector||'–')}</div><div class="small">${esc(i.result||'')}</div></div>`).join(''):'<div class="empty">Noch keine Prüfung hinterlegt.</div>'}`;show('detailPage','Equipment-Details')};
window.editEq=async id=>{let e=(await getAll(EQ)).find(x=>x.id===id);$('editId').value=id;eqFields.forEach(f=>$(f).value=e[f]??'');$('deleteBtn').style.display='block';show('formPage','Equipment bearbeiten')};$('saveBtn').onclick=async()=>{if(!$('eqNo').value.trim()||!$('name').value.trim())return alert('Equipment-Nr. und Bezeichnung sind erforderlich.');let old=$('editId').value?(await getAll(EQ)).find(x=>x.id===$('editId').value)||{}:{},e={...old,id:$('editId').value||crypto.randomUUID()};eqFields.forEach(f=>e[f]=$(f).value);await put(EQ,e);currentDetail=e.id;detailOpen(e.id)};$('deleteBtn').onclick=async()=>{if(!confirm('Equipment und zugehörige Prüfungen wirklich löschen?'))return;let id=$('editId').value;for(let i of (await getAll(INS)).filter(x=>x.equipmentId===id))await del(INS,i.id);await del(EQ,id);show('equipment')};
window.newInspection=id=>{$('inspEqId').value=id;$('inspId').value='';['inspType','inspLast','inspNext','inspInspector','inspResult'].forEach(x=>$(x).value='');$('inspInterval').value='12';show('inspectionForm','Prüfung hinzufügen')};function calcNext(){if($('inspLast').value&&+$('inspInterval').value){let d=new Date($('inspLast').value+'T12:00:00');d.setMonth(d.getMonth()+ +$('inspInterval').value);$('inspNext').value=d.toISOString().slice(0,10)}}$('inspLast').onchange=calcNext;$('inspInterval').onchange=calcNext;$('cancelInspection').onclick=()=>detailOpen($('inspEqId').value);$('saveInspection').onclick=async()=>{if(!$('inspType').value.trim())return alert('Bitte Prüfart eintragen.');let i={id:$('inspId').value||crypto.randomUUID(),equipmentId:$('inspEqId').value,type:$('inspType').value,lastCheck:$('inspLast').value,interval:+$('inspInterval').value||0,nextCheck:$('inspNext').value,inspector:$('inspInspector').value,result:$('inspResult').value,createdAt:new Date().toISOString()};await put(INS,i);detailOpen(i.equipmentId)};
function download(name,type,text){let b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}$('backupBtn').onclick=async()=>{let [e,i]=await Promise.all([getAll(EQ),getAll(INS)]);download('equipment-manager-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify({format:'EquipmentManagerBackup',version:'3.2',createdAt:new Date().toISOString(),equipment:e,inspections:i},null,2))};$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.format!=='EquipmentManagerBackup'||!Array.isArray(d.equipment))throw Error('Ungültiges Backup');if(!confirm(`${d.equipment.length} Equipment-Datensätze wiederherstellen?`))return;for(let e of d.equipment){e.id=e.id||crypto.randomUUID();await put(EQ,e)}for(let i of (d.inspections||[])){i.id=i.id||crypto.randomUUID();await put(INS,i)}await migrateLegacy();alert('Backup wiederhergestellt.');render()}catch(e){alert(e.message)}ev.target.value=''};
function csvVal(v){return '"'+String(v??'').replaceAll('"','""')+'"'}$('exportBtn').onclick=async()=>{let a=await getAll(EQ),cols=['id',...eqFields],csv=[cols.join(';'),...a.map(x=>cols.map(c=>csvVal(x[c])).join(';'))].join('\n');download('equipment.csv','text/csv','\ufeff'+csv)};$('importBtn').onclick=()=>$('importFile').click();function parseCSV(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c==='"'){if(q&&n==='"'){v+='"';i++}else q=!q}else if(c===';'&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);if(row.some(Boolean))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(Boolean))rows.push(row);return rows}$('importFile').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;let rows=parseCSV(await f.text()),head=rows.shift(),n=0;for(let r of rows){let e={};head.forEach((h,i)=>e[h]=r[i]||'');e.id=e.id||crypto.randomUUID();await put(EQ,e);n++}alert(n+' Datensätze importiert.');render();ev.target.value=''};
openDB().then(migrateLegacy).then(render);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
